name: pass7-candidate-experience
on:
  push:
  pull_request:
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: ./scripts/pass7_gate.sh
      - working-directory: apps/demo-web
        run: npm install --no-audit --no-fund && npm run contract && npm run typecheck && npm run build
