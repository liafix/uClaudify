name: pass6-terraform-azure-contract

on:
  push:
  pull_request:

jobs:
  pass6-infrastructure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - name: Install candidate frontend dependencies
        working-directory: apps/demo-web
        run: npm install
      - name: Install Azure + official MCP SDK dependencies
        run: |
          python -m pip install -r functions/azure/requirements.txt
          python -m pip install "mcp>=2,<3"
      - name: Install and start Azurite
        run: |
          npm install --global azurite@3.37.0
          mkdir -p /tmp/finbridge-azurite
          azurite --silent --location /tmp/finbridge-azurite >/tmp/azurite.log 2>&1 &
          sleep 3
      - name: PASS 6 deterministic regressions
        run: ./scripts/pass6_gate.sh
      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init without backend
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform provider-schema validation
        working-directory: infra/terraform
        run: terraform validate
      - name: Official MCP Python SDK v2 smoke
        env:
          PYTHONPATH: services/domain:services/storage:services/processing:services/mcp
        run: python scripts/pass5_official_sdk_smoke.py
      - name: Candidate frontend production build
        working-directory: apps/demo-web
        run: npm run build
