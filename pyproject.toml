[project]
name = "finbridge-cloud"
version = "0.0.1"
description = "Synthetic finance modernization candidate demo"
requires-python = ">=3.12"

[project.optional-dependencies]
azure = [
  "azure-functions==1.25.0",
  "azure-storage-blob==12.30.1",
]

mcp-sdk = [
  "mcp==2.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
